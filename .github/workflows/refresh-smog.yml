name: Refresh Smog Data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  refresh-smog:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel smog refresh endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing APP_URL or CRON_SECRET repository secret." >&2
            exit 1
          fi
          TARGET_URL="${APP_URL%/}/api/cron/refresh"
          curl --fail-with-body --silent --show-error \
            -X POST "$TARGET_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"
