server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/smog_db}
spring.datasource.username=${DB_USER:aeris}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:alert-source-migration.sql,classpath:custom-location-migration.sql
server.error.include-message=always
aeris.admin-token=${ADMIN_TOKEN:}
aeris.demo=${DEMO_MODE:false}
